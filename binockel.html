<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Binockel">
<title>Binockel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1a10;
  --bg2: #111f14;
  --surface: #162019;
  --surface2: #1d2b20;
  --border: #2a3d2d;
  --border2: #3a5040;
  --gold: #c9a84c;
  --gold-dim: rgba(201,168,76,0.15);
  --gold-glow: rgba(201,168,76,0.08);
  --cream: #f0e8d5;
  --cream2: rgba(240,232,213,0.65);
  --cream3: rgba(240,232,213,0.12);
  --cream4: rgba(240,232,213,0.06);
  --red: #d95e5e;
  --red-dim: rgba(217,94,94,0.15);
  --green: #72c47a;
  --muted: #6a8570;
  --r: 12px;
  --rs: 8px;
  --ff: 'Playfair Display', Georgia, serif;
  --fu: 'DM Sans', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:var(--fu);font-size:15px;line-height:1.5;overscroll-behavior:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.screen{display:none;flex-direction:column;height:100vh;height:100dvh}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* HEADER */
.hdr{padding:max(env(safe-area-inset-top),18px) 18px 14px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--ff);font-size:26px;font-weight:700;color:var(--gold);letter-spacing:-0.5px}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:1px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:var(--rs);border:none;font-family:var(--fu);font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s,transform .1s;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(0.97);opacity:.85}
.btn-p{background:var(--gold);color:#0d1a10;font-size:15px;font-weight:600;width:100%;padding:15px}
.btn-ghost{background:var(--cream4);color:var(--cream);border:1px solid var(--border)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(217,94,94,0.3)}
.btn-icon{width:34px;height:34px;padding:0;border-radius:50%;font-size:16px;background:var(--cream4);color:var(--cream2);border:1px solid var(--border);flex-shrink:0}
.btn-back{font-size:13px;color:var(--gold);cursor:pointer;display:flex;align-items:center;gap:4px;-webkit-user-select:none;user-select:none;white-space:nowrap}

/* HOME */
.glist{padding:14px;display:flex;flex-direction:column;gap:10px}
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;cursor:pointer;transition:border-color .2s,background .15s}
.gcard:active{background:var(--surface2);border-color:var(--gold)}
.gcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;gap:10px}
.gcard-name{font-family:var(--ff);font-size:17px;font-weight:600}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.badge-on{background:rgba(114,196,122,.2);color:var(--green)}
.badge-off{background:var(--cream4);color:var(--muted)}
.gcard-info{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.gcard-actions{display:flex;gap:8px;margin-top:11px;border-top:1px solid var(--border);padding-top:11px}
.gcard-act{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer;border:none;font-family:var(--fu);transition:opacity .15s}
.gcard-act:active{opacity:.7}
.gcard-act-share{background:var(--gold-dim);color:var(--gold)}
.gcard-act-del{background:var(--red-dim);color:var(--red)}
.empty-icon{font-size:50px;margin-bottom:14px}
.empty-t{font-family:var(--ff);font-size:20px;color:var(--cream2);margin-bottom:8px}
.empty-s{font-size:13px;line-height:1.6}

/* GAME HEADER */
.ghdr{padding:max(env(safe-area-inset-top),16px) 14px 0;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.ghdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.gtitle{font-family:var(--ff);font-size:19px;font-weight:600;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghdr-settings{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);gap:8px}
.pv-group{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pv-input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--cream);font-family:var(--fu);font-size:14px;width:62px;padding:5px 8px;text-align:right}
.pv-input:focus{outline:none;border-color:var(--gold)}

/* TABLE */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surface);padding:10px 7px;text-align:center;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:5}
.tbl th.p-col{min-width:70px}
.tbl th.ans-col{width:46px}
.tbl th.rd-col{width:28px}
.tbl th.a-col{background:var(--gold-dim)!important;color:var(--gold)!important}
.tbl td{padding:8px 6px;text-align:center;border-bottom:1px solid rgba(42,61,45,.5);vertical-align:middle}
.tbl td.p-col{min-width:70px}
.tbl td.a-col{background:var(--gold-glow)}
.tbl td.tap{cursor:pointer;transition:background .15s}
.tbl td.tap:active{background:var(--gold-dim)}
.tbl td.tap.a-col:active{background:rgba(201,168,76,.25)}
.round-top td{border-top:2px solid var(--border)}
.round-bot td{border-bottom:2px solid var(--border)}
.rz-row{background:rgba(60,110,220,.04)}
.sp-row{background:rgba(72,180,90,.04)}
.row-lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 5px;border-radius:4px}
.row-lbl.rz{color:#6b9ae0;background:rgba(107,154,224,.1)}
.row-lbl.sp{color:var(--green);background:rgba(114,196,122,.1)}
.rnum{font-size:11px;color:var(--muted);font-weight:600}
.sv{font-size:15px;font-weight:500}
.sv.e{color:var(--border2)}
.sv.pos{color:var(--cream)}
.sv.neg{color:var(--red)}
.sv.ans{font-size:14px;color:var(--gold);font-weight:600}
.totals-row td{background:var(--surface)!important;padding:12px 6px;border-top:2px solid var(--gold)!important;border-bottom:none!important}
.tv{font-size:16px;font-weight:700;font-family:var(--ff)}
.tv.pos{color:var(--green)}
.tv.neg{color:var(--red)}
.tv.z{color:var(--muted)}
.empty-rounds{text-align:center;padding:40px 14px;color:var(--muted);font-size:13px}

/* FAB */
.fab{position:sticky;bottom:0;padding:12px 14px;padding-bottom:max(env(safe-area-inset-bottom),14px);background:linear-gradient(transparent,var(--bg) 40%);display:flex;gap:10px;flex-shrink:0}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--surface2);border-radius:20px 20px 0 0;padding:20px;padding-bottom:max(env(safe-area-inset-bottom),24px);width:100%;max-width:480px;border-top:1px solid var(--border);animation:sup .25s ease-out}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-pip{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.sheet-title{font-family:var(--ff);font-size:19px;font-weight:600;margin-bottom:4px}
.sheet-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.lbl{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;display:block}
.ig{margin-bottom:14px}
.ti{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--cream);font-family:var(--fu);font-size:16px;padding:12px 14px;transition:border-color .15s}
.ti:focus{outline:none;border-color:var(--gold)}
.ni{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);color:var(--cream);font-family:var(--ff);font-size:44px;font-weight:600;padding:14px;text-align:center;transition:border-color .15s}
.ni:focus{outline:none;border-color:var(--gold)}
.psetup{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.prow{display:flex;gap:8px;align-items:center}
.prow .ti{flex:1}
.add-p{font-size:13px;color:var(--gold);cursor:pointer;display:flex;align-items:center;gap:5px;padding:7px 0;-webkit-user-select:none;user-select:none}
.btn-row{display:flex;gap:10px;margin-top:14px}
.link-btn{width:100%;margin-top:8px;background:transparent;border:none;color:var(--muted);font-family:var(--fu);font-size:13px;padding:8px;cursor:pointer;-webkit-user-select:none;user-select:none}

/* SUMMARY */
.sum-hdr{padding:max(env(safe-area-inset-top),24px) 18px 20px;text-align:center;border-bottom:1px solid var(--border)}
.sum-icon{font-size:52px;margin-bottom:8px}
.sum-title{font-family:var(--ff);font-size:26px;font-weight:700;color:var(--gold);margin-bottom:4px}
.sum-sub{font-size:13px;color:var(--muted)}
.sum-sec{padding:18px 14px 0}
.sec-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
.rank-card,.pay-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.rank-row{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border);gap:12px}
.rank-row:last-child{border-bottom:none}
.rank-row.r1{background:rgba(201,168,76,.07)}
.rnk{font-family:var(--ff);font-size:20px;font-weight:700;width:26px;text-align:center;color:var(--muted)}
.rnk.g{color:var(--gold)}.rnk.s{color:#aaa}.rnk.b{color:#b87333}
.rname{flex:1;font-size:16px;font-weight:500}
.rscore{font-family:var(--ff);font-size:18px;font-weight:700}
.rscore.pos{color:var(--green)}.rscore.neg{color:var(--red)}.rscore.z{color:var(--muted)}
.pay-row{display:flex;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border);gap:9px}
.pay-row:last-child{border-bottom:none}
.pfrom{font-size:15px;font-weight:500}
.parrow{color:var(--red);font-size:16px}
.pto{font-size:15px;font-weight:500;color:var(--gold)}
.pamount{margin-left:auto;font-family:var(--ff);font-size:18px;font-weight:700;color:var(--green)}
.nopay{text-align:center;padding:22px;color:var(--muted);font-size:14px}
.sum-btns{display:flex;gap:10px;padding-bottom:max(env(safe-area-inset-bottom),24px)}
.active-dot{font-size:8px;color:var(--gold);display:block;margin-top:2px}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<div class="screen on" id="s-home">
  <div class="hdr">
    <div class="hdr-row">
      <div>
        <div class="logo">Binockel</div>
        <div class="logo-sub">Spielstand</div>
      </div>
      <button class="btn btn-ghost" style="white-space:nowrap;flex-shrink:0" onclick="showNewSheet()">+ Neues Spiel</button>
    </div>
  </div>
  <div class="scroll"><div class="glist" id="glist"></div></div>
</div>

<!-- GAME -->
<div class="screen" id="s-game">
  <div id="g-hdr"></div>
  <div class="scroll tbl-wrap" id="g-body"></div>
  <div class="fab" id="g-fab"></div>
</div>

<!-- SUMMARY -->
<div class="screen" id="s-sum">
  <div class="scroll" id="s-body"></div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="sheet" id="sheet"></div>
</div>

</div>
<script>
var S = { games: [], cur: null };

function load() {
  try { var d = localStorage.getItem('bnk'); if (d) S = JSON.parse(d); } catch(e) {}
}
function save() {
  try { localStorage.setItem('bnk', JSON.stringify(S)); } catch(e) {}
}
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n) { return (n/100).toFixed(2).replace('.',',') + ' €'; }

function screen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
  document.getElementById('s-'+id).classList.add('on');
}

/* ===== HOME ===== */
function home() {
  S.cur = null;
  screen('home');
  var el = document.getElementById('glist');
  if (!S.games.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🃏</div><div class="empty-t">Noch keine Spiele</div><div class="empty-s">Erstelle dein erstes Binockel-Spiel und halte den Punktestand fest.</div></div>';
    return;
  }
  el.innerHTML = S.games.slice().reverse().map(function(g) {
    var d = new Date(g.ts).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
    var badge = g.done ? '<span class="badge badge-off">Beendet</span>' : '<span class="badge badge-on">Aktiv</span>';
    return '<div class="gcard" onclick="openGame(\''+g.id+'\')">' +
      '<div class="gcard-top"><div class="gcard-name">'+esc(g.name)+'</div>'+badge+'</div>' +
      '<div class="gcard-info"><span>📅 '+d+'</span><span>🎴 '+g.rounds.length+' Runden</span><span>👥 '+g.players.map(function(p){return esc(p.n);}).join(' · ')+'</span></div>' +
      '<div class="gcard-actions" onclick="event.stopPropagation()">' +
      '<button class="gcard-act gcard-act-share" onclick="shareGameText(\''+g.id+'\')">↗ Teilen</button>' +
      '<button class="gcard-act gcard-act-del" onclick="deleteGame(\''+g.id+'\')">✕ Löschen</button>' +
      '</div>' +
      '</div>';
  }).join('');
}

/* ===== NEW GAME SHEET ===== */
function showNewSheet() {
  document.getElementById('sheet').innerHTML =
    '<div class="sheet-pip"></div>' +
    '<div class="sheet-title">Neues Spiel</div>' +
    '<div class="sheet-sub">Spielname und Spieler festlegen</div>' +
    '<div class="ig"><label class="lbl">Spielname</label><input class="ti" id="ng-name" type="text" placeholder="z. B. Freitag bei Klaus" maxlength="40"></div>' +
    '<div class="ig"><label class="lbl">Spieler</label>' +
    '<div class="psetup" id="ng-players">' +
    '<div class="prow"><input class="ti" type="text" value="Spieler 1" maxlength="16"><button class="btn-icon" onclick="rmP(this)">✕</button></div>' +
    '<div class="prow"><input class="ti" type="text" value="Spieler 2" maxlength="16"><button class="btn-icon" onclick="rmP(this)">✕</button></div>' +
    '<div class="prow"><input class="ti" type="text" value="Spieler 3" maxlength="16"><button class="btn-icon" onclick="rmP(this)">✕</button></div>' +
    '</div><div class="add-p" onclick="addP()">＋ Spieler hinzufügen</div></div>' +
    '<div class="ig"><label class="lbl">ct pro Punkt</label><input class="ti" id="ng-pv" type="number" step="0.01" min="0" placeholder="0.50" value="0.50"></div>' +
    '<button class="btn btn-p" onclick="createGame()" style="margin-top:6px">Spiel starten</button>';
  openOverlay();
  setTimeout(function(){ document.getElementById('ng-name').focus(); }, 320);
}

function addP() {
  var ps = document.getElementById('ng-players');
  var n = ps.children.length + 1;
  var d = document.createElement('div'); d.className = 'prow';
  d.innerHTML = '<input class="ti" type="text" value="Spieler '+n+'" maxlength="16"><button class="btn-icon" onclick="rmP(this)">✕</button>';
  ps.appendChild(d);
}
function rmP(btn) {
  var ps = document.getElementById('ng-players');
  if (ps.children.length <= 2) return;
  btn.parentElement.remove();
}

function createGame() {
  var name = (document.getElementById('ng-name').value.trim()) || 'Spiel';
  var pinputs = document.querySelectorAll('#ng-players .prow input');
  var players = Array.from(pinputs).map(function(inp,i){ return {id:uid(), n: inp.value.trim()||(('Spieler '+(i+1)))}; });
  var pv = parseFloat(document.getElementById('ng-pv').value) || 0.5;
  var g = { id:uid(), name:name, ts:Date.now(), players:players, pv:pv, rounds:[], done:false, activeIdx:0 };
  S.games.push(g);
  S.cur = g.id;
  save();
  closeOverlay();
  renderGame();
}

/* ===== GAME ===== */
function openGame(id) { S.cur = id; renderGame(); }
function cg() { return S.games.find(function(g){ return g.id === S.cur; }); }

function renderGame() {
  var g = cg();
  if (!g) { home(); return; }
  screen('game');
  renderGhdr(g);
  renderGbody(g);
  renderGfab(g);
}

function renderGhdr(g) {
  var el = document.getElementById('g-hdr');
  el.className = 'ghdr';
  el.innerHTML =
    '<div class="ghdr-top">' +
    '<div class="btn-back" onclick="home()">← Zurück</div>' +
    '<div class="gtitle">'+esc(g.name)+'</div>' +
    '<button class="btn btn-ghost" style="font-size:12px;padding:7px 11px;white-space:nowrap;flex-shrink:0" onclick="manageSheet()">Spieler ✎</button>' +
    '</div>' +
    '<div class="ghdr-settings">' +
    '<div class="pv-group"><span>1 Punkt =</span>' +
    '<input class="pv-input" type="number" step="0.01" min="0" value="'+g.pv+'" onchange="updPv(this.value)"'+(g.done?' disabled':'')+'>ct</div>' +
    (g.done
      ? '<button class="btn btn-ghost" style="font-size:12px;padding:7px 12px" onclick="showSum()">Auswertung ›</button>'
      : '<button class="btn btn-danger" style="font-size:12px;padding:7px 12px" onclick="confirmEnd()">Beenden</button>') +
    '</div>';
}

function renderGbody(g) {
  var ap = g.done ? -1 : (g.activeIdx !== undefined ? g.activeIdx : g.rounds.length % g.players.length);
  var thead = '<thead><tr><th class="rd-col">#</th><th class="ans-col">Ans.</th>';
  g.players.forEach(function(p,i){
    var act = !g.done && i===ap;
    var clickable = !g.done && !act;
    thead += '<th class="p-col'+(act?' a-col':'')+'"'+(clickable?' onclick="setActivePlayer('+i+')" style="cursor:pointer" title="Als aktiven Spieler setzen"':'')+'>'+esc(p.n)+(act?'<span class="active-dot">● dran</span>':'')+'</th>';
  });
  thead += '</tr></thead>';

  var tbody = '<tbody>';
  if (!g.rounds.length) {
    tbody += '<tr><td colspan="'+(2+g.players.length)+'" class="empty-rounds">Noch keine Runden — tippe auf „+ Runde" um zu beginnen</td></tr>';
  }
  g.rounds.forEach(function(r,ri){
    var rap = ri % g.players.length;
    var ansVal = r.ans !== undefined ? '<span class="sv ans">'+r.ans+'</span>' : '<span class="sv e">–</span>';
    var ansTap = !g.done ? 'tap" onclick="scoreInput('+ri+',\'ans\',null,null)' : '"';

    // Row 1: Reizen
    tbody += '<tr class="rz-row round-top">' +
      '<td class="rd-col" rowspan="2"><span class="rnum">'+(ri+1)+'</span></td>' +
      '<td class="ans-col '+ansTap+'">'+ansVal+'</td>';
    g.players.forEach(function(p,pi){
      var v = r.rz[p.id];
      var cls = v===undefined?'e':v<0?'neg':'pos';
      var disp = v===undefined?'–':v;
      var act = pi===rap?' a-col':'';
      var tap = !g.done?' tap" onclick="scoreInput('+ri+',\'rz\',\''+p.id+'\',\''+esc(p.n)+'\')"':'"';
      tbody += '<td class="p-col'+act+' '+tap+'"><span class="sv '+cls+'">'+disp+'</span></td>';
    });
    tbody += '</tr>';

    // Row 2: Spielen
    tbody += '<tr class="sp-row round-bot"><td class="ans-col"><span class="row-lbl sp">Sp</span></td>';
    g.players.forEach(function(p,pi){
      var v = r.sp[p.id];
      var cls = v===undefined?'e':v<0?'neg':'pos';
      var disp = v===undefined?'–':v;
      var act = pi===rap?' a-col':'';
      var tap = !g.done?' tap" onclick="scoreInput('+ri+',\'sp\',\''+p.id+'\',\''+esc(p.n)+'\')"':'"';
      tbody += '<td class="p-col'+act+' '+tap+'"><span class="sv '+cls+'">'+disp+'</span></td>';
    });
    tbody += '</tr>';
  });

  // Totals
  var tots = calcTotals(g);
  var maxT = Math.max.apply(null, g.players.map(function(p){ return tots[p.id]||0; }));
  tbody += '<tr class="totals-row"><td colspan="2" style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Gesamt</td>';
  g.players.forEach(function(p){
    var t = tots[p.id]||0;
    var cls = t>0?'pos':t<0?'neg':'z';
    var crown = (t===maxT&&g.rounds.length>0&&t!==0)?'<br><span style="font-size:14px">👑</span>':'';
    tbody += '<td><span class="tv '+cls+'">'+t+'</span>'+crown+'</td>';
  });
  tbody += '</tr></tbody>';

  document.getElementById('g-body').innerHTML = '<table class="tbl">'+thead+tbody+'</table>';
}

function renderGfab(g) {
  var el = document.getElementById('g-fab');
  if (g.done) {
    el.innerHTML = '<button class="btn btn-ghost" style="flex:1" onclick="home()">← Startseite</button>' +
      '<button class="btn btn-p" style="flex:2" onclick="showSum()">Auswertung ansehen</button>';
  } else {
    el.innerHTML = '<button class="btn btn-p" style="flex:1" onclick="addRound()">+ Runde</button>';
  }
}

function setActivePlayer(i) {
  var g = cg(); if (!g || g.done) return;
  g.activeIdx = i; save(); renderGame();
}

function addRound() {
  var g = cg(); if (!g||g.done) return;
  g.rounds.push({rz:{}, sp:{}, ans:undefined});
  var cur = g.activeIdx !== undefined ? g.activeIdx : (g.rounds.length - 1) % g.players.length;
  g.activeIdx = (cur + 1) % g.players.length;
  save(); renderGame();
  setTimeout(function(){ var b=document.getElementById('g-body'); b.scrollTop=b.scrollHeight; },60);
}

/* ===== SCORE INPUT ===== */
function scoreInput(ri, type, pid, pname) {
  var g = cg(); if (!g) return;
  var r = g.rounds[ri];
  var cur, label, sublabel;
  if (type==='ans') {
    cur = r.ans; label = 'Ansage'; sublabel = 'Runde '+(ri+1)+' · Reizwert';
  } else if (type==='rz') {
    cur = r.rz[pid]; label = esc(pname); sublabel = 'Runde '+(ri+1)+' · Reizen';
  } else {
    cur = r.sp[pid]; label = esc(pname); sublabel = 'Runde '+(ri+1)+' · Spielen';
  }
  var delBtn = cur!==undefined
    ? '<button class="link-btn" onclick="clearScore('+ri+',\''+type+'\',\''+pid+'\')">Eintrag löschen</button>' : '';

  document.getElementById('sheet').innerHTML =
    '<div class="sheet-pip"></div>' +
    '<div class="sheet-title">'+label+'</div>' +
    '<div class="sheet-sub">'+sublabel+'</div>' +
    '<div style="display:flex;gap:10px;align-items:center">' +
    '<button id="si-sign" onclick="toggleSign()" style="flex-shrink:0;width:52px;height:72px;border-radius:10px;border:1px solid var(--border);background:var(--cream4);color:var(--cream);font-size:26px;font-weight:300;cursor:pointer;font-family:var(--ff)">'+((cur!==undefined&&cur<0)?'−':'+')+'</button>' +
    '<input class="ni" id="si" type="number" inputmode="numeric" placeholder="0" value="'+(cur!==undefined?Math.abs(cur):'')+'" style="flex:1" onkeydown="if(event.key===\'Enter\')saveScore('+ri+',\''+type+'\',\''+pid+'\')">' +
    '</div>' +
    '<div class="btn-row">' +
    '<button class="btn btn-ghost" style="flex:1" onclick="closeOverlay()">Abbrechen</button>' +
    '<button class="btn btn-p" style="flex:2" onclick="saveScore('+ri+',\''+type+'\',\''+pid+'\')">Speichern</button>' +
    '</div>'+delBtn;
  openOverlay();
  setTimeout(function(){ var i=document.getElementById('si'); if(i){i.focus();i.select();} },320);
}

function toggleSign() {
  var btn = document.getElementById('si-sign');
  var isNeg = btn.textContent === '−';
  btn.textContent = isNeg ? '+' : '−';
  btn.style.color = isNeg ? 'var(--cream)' : 'var(--red)';
  btn.style.borderColor = isNeg ? 'var(--border)' : 'rgba(217,94,94,0.4)';
}
function parseScore(v) {
  if (v===''||v===null||v===undefined) return undefined;
  var n = parseInt(v, 10);
  return isNaN(n) ? undefined : n;
}
function saveScore(ri, type, pid) {
  var g = cg(); if (!g) return;
  var v = document.getElementById('si').value;
  var signBtn = document.getElementById('si-sign');
  var neg = signBtn && signBtn.textContent === '−';
  var r = g.rounds[ri];
  var n = parseScore(v);
  if (n !== undefined && neg) n = -Math.abs(n);
  if (n !== undefined && !neg) n = Math.abs(n);
  if (type==='ans') {
    r.ans = n;
  } else {
    if (n===undefined) delete r[type][pid]; else r[type][pid]=n;
  }
  save(); closeOverlay(); renderGame();
}

function clearScore(ri, type, pid) {
  var g = cg(); if (!g) return;
  var r = g.rounds[ri];
  if (type==='ans') r.ans=undefined; else delete r[type][pid];
  save(); closeOverlay(); renderGame();
}

function updPv(v) {
  var g = cg(); if (!g) return;
  g.pv = parseFloat(v)||0; save();
}

/* ===== PLAYER MANAGEMENT ===== */
function manageSheet() {
  var g = cg(); if (!g) return;
  document.getElementById('sheet').innerHTML =
    '<div class="sheet-pip"></div>' +
    '<div class="sheet-title">Spieler</div>' +
    '<div class="sheet-sub">Namen bearbeiten, hinzufügen oder entfernen</div>' +
    '<div class="psetup" id="mp">'+
    g.players.map(function(p){
      return '<div class="prow" data-id="'+p.id+'"><input class="ti" type="text" value="'+esc(p.n)+'" maxlength="16" oninput="renameP(\''+p.id+'\',this.value)"><button class="btn-icon" onclick="removeP(\''+p.id+'\')">✕</button></div>';
    }).join('')+
    '</div><div class="add-p" onclick="addNewP()">＋ Spieler hinzufügen</div>' +
    '<button class="btn btn-p" style="margin-top:14px" onclick="closeOverlay()">Fertig</button>';
  openOverlay();
}

function renameP(pid, val) {
  var g=cg(); if(!g) return;
  var p=g.players.find(function(p){return p.id===pid;}); if(p){p.n=val||p.n; save();}
}
function removeP(pid) {
  var g=cg(); if(!g||g.players.length<=2) return;
  g.players=g.players.filter(function(p){return p.id!==pid;});
  g.rounds.forEach(function(r){ delete r.rz[pid]; delete r.sp[pid]; });
  save(); manageSheet(); renderGame();
}
function addNewP() {
  var g=cg(); if(!g) return;
  g.players.push({id:uid(), n:'Spieler '+(g.players.length+1)});
  save(); manageSheet(); renderGame();
}

/* ===== FINISH ===== */
function confirmEnd() {
  document.getElementById('sheet').innerHTML =
    '<div class="sheet-pip"></div>' +
    '<div class="sheet-title">Spiel beenden?</div>' +
    '<div class="sheet-sub">Das Spiel wird abgeschlossen. Danach können keine Punkte mehr eingetragen werden.</div>' +
    '<div class="btn-row">' +
    '<button class="btn btn-ghost" style="flex:1" onclick="closeOverlay()">Weiter spielen</button>' +
    '<button class="btn btn-danger" style="flex:1" onclick="endGame()">Beenden</button>' +
    '</div>';
  openOverlay();
}
function endGame() {
  var g=cg(); if(!g) return;
  g.done=true; g.endTs=Date.now(); save(); closeOverlay(); renderGame();
  setTimeout(function(){ showSum(); },200);
}

/* ===== SUMMARY ===== */
function showSum() {
  var g=cg(); if(!g) return;
  screen('sum');
  var tots=calcTotals(g);
  var ranked=g.players.map(function(p){return {n:p.n,t:tots[p.id]||0};}).sort(function(a,b){return b.t-a.t;});
  var medals=['🥇','🥈','🥉']; var rankCls=['g','s','b'];
  var rankHtml=ranked.map(function(p,i){
    var cls=p.t>0?'pos':p.t<0?'neg':'z';
    return '<div class="rank-row'+(i===0?' r1':'')+'"><div class="rnk '+(rankCls[i]||'')+'">'+
      (medals[i]||((i+1)+'.'))+
      '</div><div class="rname">'+esc(p.n)+'</div><div class="rscore '+cls+'">'+
      (p.t>0?'+':'')+p.t+' Pkt</div></div>';
  }).join('');

  var settle=calcSettle(ranked,g.pv);
  var payHtml=settle.length===0
    ? '<div class="nopay">Alle gleich auf – keine Zahlungen nötig 🎉</div>'
    : settle.map(function(s){
        return '<div class="pay-row"><div class="pfrom">'+esc(s.from)+'</div>' +
          '<div class="parrow">→</div><div class="pto">'+esc(s.to)+'</div>' +
          '<div class="pamount">'+fmt(s.amt)+'</div></div>';
      }).join('');

  document.getElementById('s-body').innerHTML =
    '<div class="sum-hdr"><div class="sum-icon">🏆</div>' +
    '<div class="sum-title">Spielende</div>' +
    '<div class="sum-sub">'+esc(g.name)+' · '+g.rounds.length+' Runden</div></div>' +
    '<div class="sum-sec">' +
    '<div class="sec-title">Rangliste</div><div class="rank-card">'+rankHtml+'</div>' +
    '<div class="sec-title">Abrechnung ('+g.pv.toString().replace('.',',')+' ct/Pkt)</div>' +
    '<div class="pay-card">'+payHtml+'</div>' +
    '<div class="sum-btns">' +
    '<button class="btn btn-ghost" style="flex:1" onclick="renderGame()">Zur Tabelle</button>' +
    '<button class="btn btn-ghost" style="flex:1" onclick="shareGameText(\''+g.id+'\')">↗ Teilen</button>' +
    '<button class="btn btn-p" style="flex:1" onclick="home()">Startseite</button>' +
    '</div></div>';
}

/* ===== DELETE GAME ===== */
function deleteGame(id) {
  var g = S.games.find(function(g){ return g.id===id; });
  if (!g) return;
  document.getElementById('sheet').innerHTML =
    '<div class="sheet-pip"></div>' +
    '<div class="sheet-title">Spiel löschen?</div>' +
    '<div class="sheet-sub">„'+esc(g.name)+'" wird unwiderruflich gelöscht.</div>' +
    '<div class="btn-row">' +
    '<button class="btn btn-ghost" style="flex:1" onclick="closeOverlay()">Abbrechen</button>' +
    '<button class="btn btn-danger" style="flex:1" onclick="confirmDelete(\''+id+'\')">Löschen</button>' +
    '</div>';
  openOverlay();
}
function confirmDelete(id) {
  S.games = S.games.filter(function(g){ return g.id!==id; });
  save(); closeOverlay(); home();
}

/* ===== SHARE / EXPORT ===== */
function buildShareText(id) {
  var g = S.games.find(function(g){ return g.id===id; });
  if (!g) return '';
  var d = new Date(g.ts).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  var lines = [];
  lines.push('🃏 Binockel – '+g.name);
  lines.push('📅 '+d+' · '+g.rounds.length+' Runden');
  lines.push('');

  // Column widths
  var COL = 7;
  var header = '      ';
  g.players.forEach(function(p){
    header += p.n.substring(0,COL).padStart(COL);
  });
  lines.push(header);
  lines.push('─'.repeat(header.length));

  g.rounds.forEach(function(r,ri){
    var rzLine = ('R'+(ri+1)+' Rz').padEnd(6);
    var spLine = ('R'+(ri+1)+' Sp').padEnd(6);
    g.players.forEach(function(p){
      var rv = r.rz[p.id]; var sv = r.sp[p.id];
      rzLine += (rv===undefined?'–':String(rv)).padStart(COL);
      spLine += (sv===undefined?'–':String(sv)).padStart(COL);
    });
    lines.push(rzLine);
    lines.push(spLine);
  });

  lines.push('─'.repeat(header.length));
  var tots = calcTotals(g);
  var totLine = 'Σ     ';
  g.players.forEach(function(p){
    var t = tots[p.id]||0;
    totLine += (t>0?'+':'')+t;
    totLine = totLine.padEnd(6 + g.players.indexOf(p)*COL + COL);
  });
  // simpler total line
  var totLine2 = '🏁 Gesamt: '+g.players.map(function(p){
    var t=tots[p.id]||0; return p.n+': '+(t>0?'+':'')+t;
  }).join(' | ');
  lines.push(totLine2);

  var ranked = g.players.map(function(p){return {n:p.n,t:tots[p.id]||0};}).sort(function(a,b){return b.t-a.t;});
  var settle = calcSettle(ranked, g.pv);
  if (settle.length>0) {
    lines.push('');
    lines.push('💰 Abrechnung ('+g.pv.toString().replace('.',',')+' ct/Pkt):');
    settle.forEach(function(s){
      lines.push('  '+s.from+' → '+s.to+': '+fmt(s.amt));
    });
  } else {
    lines.push('');
    lines.push('🎉 Alle gleich – keine Zahlungen!');
  }
  lines.push('');
  lines.push('📱 Binockel App: https://888kyle.github.io/Binockel/');
  return lines.join('\n');
}

function shareGameText(id) {
  var text = buildShareText(id);
  if (navigator.share) {
    navigator.share({ text: text }).catch(function(){});
  } else {
    navigator.clipboard && navigator.clipboard.writeText(text).then(function(){
      alert('Spielstand in Zwischenablage kopiert!');
    }).catch(function(){
      var t=document.createElement('textarea'); t.value=text;
      document.body.appendChild(t); t.select(); document.execCommand('copy');
      document.body.removeChild(t); alert('Spielstand kopiert!');
    });
  }
}

/* ===== CALC ===== */
function calcTotals(g) {
  var t={};
  g.players.forEach(function(p){t[p.id]=0;});
  g.rounds.forEach(function(r){
    g.players.forEach(function(p){
      if(r.rz[p.id]!==undefined) t[p.id]+=r.rz[p.id];
      if(r.sp[p.id]!==undefined) t[p.id]+=r.sp[p.id];
    });
  });
  return t;
}

function calcSettle(ranked, pv) {
  // All losers pay the winner
  var w=ranked[0]; var res=[];
  for(var i=1;i<ranked.length;i++){
    var diff=w.t-ranked[i].t;
    if(diff>0&&pv>0) res.push({from:ranked[i].n, to:w.n, amt:diff*pv});
  }
  return res;
}

/* ===== OVERLAY ===== */
function openOverlay(){ document.getElementById('overlay').classList.add('on'); }
function closeOverlay(){
  document.getElementById('overlay').classList.remove('on');
  if(S.cur){ var g=cg(); if(g&&document.getElementById('s-game').classList.contains('on')){ renderGhdr(g); renderGbody(g); } }
}
function overlayClick(e){ if(e.target===document.getElementById('overlay')) closeOverlay(); }

/* ===== INIT ===== */
load(); home();
</script>
